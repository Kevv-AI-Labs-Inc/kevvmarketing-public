name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Lint
        run: npm --prefix next-app run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Type check
        run: npm run check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Unit, integration, and harness tests
        run: npm --prefix next-app run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Build
        run: npm --prefix next-app run build

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Install Playwright Chromium
        working-directory: next-app
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm --prefix next-app run build

      - name: Playwright smoke tests
        run: npm --prefix next-app run test:e2e:smoke

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            next-app/playwright-report
            next-app/test-results
          if-no-files-found: ignore

  e2e-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Install Playwright Chromium
        working-directory: next-app
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm --prefix next-app run build

      - name: Playwright critical tests
        run: npm --prefix next-app run test:e2e:critical

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-artifacts
          path: |
            next-app/playwright-report
            next-app/test-results
          if-no-files-found: ignore

  validate:
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - build
      - e2e-smoke
      - e2e-critical
    if: ${{ always() }}

    steps:
      - name: Fail if any required job failed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_SMOKE_RESULT: ${{ needs.e2e-smoke.result }}
          E2E_CRITICAL_RESULT: ${{ needs.e2e-critical.result }}
        run: |
          for result in \
            "$LINT_RESULT" \
            "$TYPECHECK_RESULT" \
            "$TEST_RESULT" \
            "$BUILD_RESULT" \
            "$E2E_SMOKE_RESULT" \
            "$E2E_CRITICAL_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "Required CI job failed with result: $result"
              exit 1
            fi
          done

      - name: Report aggregate success
        run: echo "validate passed"

