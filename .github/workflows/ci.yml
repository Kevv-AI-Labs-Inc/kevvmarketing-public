name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Lint
        run: npm --prefix next-app run lint

      - name: Build
        run: npm --prefix next-app run build
