name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Lint
        run: npm --prefix next-app run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Type check
        run: npm run check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Unit, integration, and harness tests
        run: npm --prefix next-app run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Build
        run: npm --prefix next-app run build

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Install Playwright Chromium
        working-directory: next-app
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm --prefix next-app run build

      - name: Playwright smoke tests
        run: npm --prefix next-app run test:e2e:smoke

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            next-app/playwright-report
            next-app/test-results
          if-no-files-found: ignore

  e2e-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Install Playwright Chromium
        working-directory: next-app
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm --prefix next-app run build

      - name: Playwright critical tests
        run: npm --prefix next-app run test:e2e:critical

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-critical-artifacts
          path: |
            next-app/playwright-report
            next-app/test-results
          if-no-files-found: ignore
