name: Nightly Quality

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install next-app dependencies
        run: npm --prefix next-app ci

      - name: Install Playwright browsers
        working-directory: next-app
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: npm --prefix next-app run lint

      - name: Type check
        run: npm run check

      - name: Unit, integration, and harness tests
        run: npm --prefix next-app run test

      - name: Nightly harness suite
        run: npm --prefix next-app run test:harness

      - name: Build
        run: npm --prefix next-app run build

      - name: Full Playwright suite
        run: npm --prefix next-app run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-artifacts
          path: |
            next-app/playwright-report
            next-app/test-results
          if-no-files-found: ignore
