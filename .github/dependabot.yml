version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "root"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      root-npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "drizzle-kit"
        update-types:
          - "version-update:semver-minor"

  - package-ecosystem: "npm"
    directory: "/next-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "next-app"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      next-app-runtime-minor-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      next-app-dev-minor-patch:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "next"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "next-auth"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "eslint-config-next"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
