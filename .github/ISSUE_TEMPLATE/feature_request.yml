name: Feature request
description: Propose a product or developer-experience improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: impact
    attributes:
      label: Main impact area
      options:
        - Authentication
        - Listings / search
        - Share pages
        - Subscriptions
        - CMA / reports
        - AI content generation
        - Maps / neighborhood
        - Deployment / developer experience
        - Documentation
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
